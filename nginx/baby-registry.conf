# nginx reverse proxy for the Baby Registry Tracker.
# Install on the Pi at /etc/nginx/sites-available/baby-registry and symlink:
#   sudo ln -sf /etc/nginx/sites-available/baby-registry /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Uses the Let's Encrypt cert issued by setup-certs.sh (DNS-01 / Route53).
# The Pi is NOT exposed to the internet — these ports are only reachable on the
# LAN, and baby.henkhaus.org resolves to 10.0.3.2 via local UniFi DNS.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name baby.henkhaus.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baby.henkhaus.org;

    # Let's Encrypt certificate (auto-renewed by certbot.timer).
    ssl_certificate     /etc/letsencrypt/live/baby.henkhaus.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baby.henkhaus.org/privkey.pem;

    # Modern, safe TLS defaults.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Proxy everything to the Express app (API + static frontend) on :3001.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
