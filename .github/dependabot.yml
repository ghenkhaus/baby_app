version: 2
updates:
  # Frontend + Express backend (root package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Bundle minor + patch bumps into a single PR to cut noise.
      # Major bumps still open individually (they can break) and won't auto-merge.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # MCP server (mcp-server/package.json)
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      mcp-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
